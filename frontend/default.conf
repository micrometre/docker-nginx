
upstream nextjs_upstream {
  server nextjs:8080;
}

server {
	listen 80 default_server;
	listen [::]:80 default_server;

	index index.html index.htm index.nginx-debian.html;
	server_name _;

	location / {
		try_files $uri $uri/ =404;
	}
    location / {
    proxy_pass http://nextjs_upstream;
  }

}

